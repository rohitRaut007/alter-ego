[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
# D: sets a default only; CI overrides DATABASE_URL to run against Postgres.
env =
    D:DJANGO_SECRET_KEY=test-secret-key-for-tests-only-0123456789
    D:DATABASE_URL=sqlite:///:memory:
    D:REDIS_URL=
    D:AUTH_THROTTLE_RATE=1000/min
    D:FIELD_ENCRYPTION_KEYS=test:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    D:SSE_POLL_SECONDS=0
    D:FAKE_LLM_DELAY_MS=0
    D:MENTOR_THROTTLE_RATE=1000/hour
    D:ALPHA_GRANT_FULL=false
    D:LLM_PROVIDER=fake
    D:DJANGO_DEBUG=false
