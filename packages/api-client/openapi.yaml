      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - interviews
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteResponse'
          description: ''
  /api/v1/interviews/{id}/turns:
    post:
      operationId: interviews_turns_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
