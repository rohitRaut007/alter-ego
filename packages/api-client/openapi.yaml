openapi: 3.0.3
info:
  title: Alter Ego OS API
  version: 0.1.0
  description: Contract between the Django API and the web and mobile clients.
paths:
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/v1/auth/token:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    delete:
      operationId: me_destroy
      description: Hard delete the account and everything linked to it.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/consents:
    get:
      operationId: me_consents_list
      description: Read the ledger or append a new decision. Rows are never edited.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consent'
          description: ''
    post:
      operationId: me_consents_create
      description: Read the ledger or append a new decision. Rows are never edited.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsentInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsentInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
          description: ''
components:
  schemas:
    Consent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        purpose:
          allOf:
          - $ref: '#/components/schemas/PurposeEnum'
          readOnly: true
        version:
          type: string
          readOnly: true
        granted:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - granted
      - id
      - purpose
      - version
    ConsentInputRequest:
      type: object
      properties:
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        version:
          type: string
          minLength: 1
          maxLength: 32
        granted:
          type: boolean
      required:
      - granted
      - purpose
      - version
    EntitlementsEnum:
      enum:
      - protocol
      - daily_os
      - character
      - knowledge
      - mentor
      - presence
      - legacy
      - calendar
      type: string
      description: |-
        * `protocol` - protocol
        * `daily_os` - daily_os
        * `character` - character
        * `knowledge` - knowledge
        * `mentor` - mentor
        * `presence` - presence
        * `legacy` - legacy
        * `calendar` - calendar
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          maxLength: 120
        timezone:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 8
        ai_training_opt_out:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        tier:
          allOf:
          - $ref: '#/components/schemas/TierEnum'
          readOnly: true
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementsEnum'
          readOnly: true
      required:
      - created_at
      - email
      - entitlements
      - id
      - tier
    PatchedMeRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 120
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        locale:
          type: string
          minLength: 1
          maxLength: 8
        ai_training_opt_out:
          type: boolean
    PurposeEnum:
      enum:
      - terms
      - privacy
      - ai_processing
      - analytics
      - marketing
      type: string
      description: |-
        * `terms` - Terms
        * `privacy` - Privacy
        * `ai_processing` - Ai Processing
        * `analytics` - Analytics
        * `marketing` - Marketing
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        display_name:
          type: string
          maxLength: 120
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        consents:
          type: array
          items:
            $ref: '#/components/schemas/ConsentInputRequest'
      required:
      - consents
      - email
      - password
    RegisterResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/Me'
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
      - user
    TierEnum:
      enum:
      - core
      - full
      type: string
      description: |-
        * `core` - core
        * `full` - full
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
