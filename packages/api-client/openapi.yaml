            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
          description: ''
  /api/v1/daily/brief:
    get:
      operationId: daily_brief_retrieve
      description: 'Morning brief: what today demands, from the sprint and this week''s
        progress.'
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD, defaults to today
      tags:
      - daily
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
          description: ''
