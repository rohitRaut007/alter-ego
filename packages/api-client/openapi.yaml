components:
  schemas:
    ActionEnum:
      enum:
      - end
      - abandon
      type: string
      description: |-
        * `end` - end
        * `abandon` - abandon
    AdvisorRequestRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - query
    AdvisorResult:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AdvisorSource'
        safety:
          allOf:
          - $ref: '#/components/schemas/SafetyNotice'
          nullable: true
      required:
      - answer
      - safety
      - sources
    AdvisorSource:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        summary:
          type: string
      required:
      - author
      - id
      - summary
      - title
    AnswerRequestRequest:
      type: object
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - answer
    Brief:
      type: object
      properties:
        date:
          type: string
          format: date
        day_number:
          type: integer
        total_days:
          type: integer
        sprint_over:
          type: boolean
        sprint_goal:
          type: string
        tone:
          $ref: '#/components/schemas/ToneEnum'
        headline:
          type: string
        body:
          type: string
        insight:
          type: string
          nullable: true
        week:
          $ref: '#/components/schemas/WeekProgress'
        focus:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        due_tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        completed_today:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        checklist:
          $ref: '#/components/schemas/ChecklistProgress'
        practices:
          type: array
          items:
            $ref: '#/components/schemas/PracticeState'
        practice_streak:
          type: integer
        best_practice_streak:
          type: integer
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleBlock'
        deep_work_target_minutes:
          type: integer
        deep_work_minutes_today:
          type: integer
        reflection_done:
          type: boolean
        ritual:
          $ref: '#/components/schemas/RitualState'
        alter_ego_name:
          type: string
        identity_statement:
          type: string
      required:
      - alter_ego_name
      - best_practice_streak
      - body
      - checklist
      - completed_today
      - date
      - day_number
      - deep_work_minutes_today
      - deep_work_target_minutes
      - due_tasks
      - focus
      - headline
      - identity_statement
      - insight
      - practice_streak
      - practices
      - reflection_done
      - ritual
      - schedule
      - sprint_goal
      - sprint_over
      - tone
      - total_days
      - week
    CadenceEnum:
      enum:
      - daily
      - weekly
      type: string
      description: |-
        * `daily` - daily
        * `weekly` - weekly
    CategoryEnum:
      enum:
      - crisis
      - distress
      type: string
      description: |-
        * `crisis` - crisis
        * `distress` - distress
    Challenge:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        week_index:
          type: integer
          readOnly: true
        layer:
          allOf:
          - $ref: '#/components/schemas/LayerEnum'
          readOnly: true
        difficulty:
          allOf:
          - $ref: '#/components/schemas/DifficultyEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        detail:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ChallengeStatusEnum'
          readOnly: true
        task_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - detail
      - difficulty
      - id
      - layer
      - status
      - task_id
      - title
      - week_index
    ChallengeStatusEnum:
      enum:
      - offered
      - accepted
      - dismissed
      type: string
      description: |-
        * `offered` - Offered
        * `accepted` - Accepted
        * `dismissed` - Dismissed
    ChecklistProgress:
      type: object
      properties:
        total:
          type: integer
        done:
          type: integer
        overdue:
          type: integer
      required:
      - done
      - overdue
      - total
    CompleteResponse:
      type: object
      properties:
        protocol_id:
          type: string
          format: uuid
      required:
      - protocol_id
    ConnectRequest:
      type: object
      properties:
        account_email:
          type: string
          format: email
          minLength: 1
      required:
      - account_email
    Consent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        purpose:
          allOf:
          - $ref: '#/components/schemas/PurposeEnum'
          readOnly: true
        version:
          type: string
          readOnly: true
        granted:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - granted
      - id
      - purpose
      - version
    ConsentInputRequest:
      type: object
      properties:
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        version:
          type: string
          minLength: 1
          maxLength: 32
        granted:
          type: boolean
      required:
      - granted
      - purpose
      - version
    Dashboard:
      type: object
      properties:
        day_number:
          type: integer
        total_days:
          type: integer
        sprint_percent:
          type: integer
        sprint_goal:
          type: string
        alter_ego_name:
          type: string
        identity_statement:
          type: string
        tone:
          $ref: '#/components/schemas/ToneEnum'
        headline:
          type: string
        body:
          type: string
        insight:
          type: string
          nullable: true
        priority_task:
          allOf:
          - $ref: '#/components/schemas/Task'
          nullable: true
        key_results:
          type: array
          items:
            $ref: '#/components/schemas/KeyResult'
        weekly_momentum:
          type: array
          items:
            $ref: '#/components/schemas/Momentum'
        stats:
          $ref: '#/components/schemas/DashboardStats'
        layers:
          type: array
          items:
            $ref: '#/components/schemas/Layer'
        personality_completed:
          type: boolean
        unread_nudges:
          type: integer
        ritual_due:
          type: boolean
      required:
      - alter_ego_name
      - body
      - day_number
      - headline
      - identity_statement
      - insight
      - key_results
      - layers
      - personality_completed
      - priority_task
      - ritual_due
      - sprint_goal
      - sprint_percent
      - stats
      - tone
      - total_days
      - unread_nudges
      - weekly_momentum
    DashboardStats:
      type: object
      properties:
        tasks_done_today:
          type: integer
        tasks_due_today:
          type: integer
        practices_done:
          type: integer
        practices_total:
          type: integer
        longest_streak:
          type: integer
        reading_progress:
          type: integer
      required:
      - longest_streak
      - practices_done
      - practices_total
      - reading_progress
      - tasks_done_today
      - tasks_due_today
    DayOffsetEnum:
      enum:
      - 0
      - 14
      - 30
      type: integer
      description: |-
        * `0` - 0
        * `14` - 14
        * `30` - 30
    DeepWorkSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        task_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        planned_minutes:
          type: integer
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        abandoned:
          type: boolean
          readOnly: true
        actual_minutes:
          type: integer
          readOnly: true
      required:
      - abandoned
      - actual_minutes
      - ended_at
      - id
      - planned_minutes
      - started_at
      - task_id
    DeepWorkStartRequest:
      type: object
      properties:
        planned_minutes:
          type: integer
          maximum: 240
          minimum: 5
          default: 90
        task_id:
          type: string
          format: uuid
          nullable: true
    DifficultyEnum:
      enum:
      - Light
      - Medium
      - Hard
      type: string
      description: |-
        * `Light` - Light
        * `Medium` - Medium
        * `Hard` - Hard
    EntitlementsEnum:
      enum:
      - protocol
      - daily_os
      - character
      - knowledge
      - mentor
      - presence
      - legacy
      - calendar
      type: string
      description: |-
        * `protocol` - protocol
        * `daily_os` - daily_os
        * `character` - character
        * `knowledge` - knowledge
        * `mentor` - mentor
        * `presence` - presence
        * `legacy` - legacy
        * `calendar` - calendar
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        start:
          type: string
          format: date-time
          readOnly: true
        end:
          type: string
          format: date-time
          readOnly: true
