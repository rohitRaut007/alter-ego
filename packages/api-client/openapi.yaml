openapi: 3.0.3
info:
  title: Alter Ego OS API
  version: 0.1.0
  description: Contract between the Django API and the web and mobile clients.
paths:
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/v1/auth/token:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/daily/brief:
    get:
      operationId: daily_brief_retrieve
      description: 'Morning brief: what today demands, from the sprint and this week''s
        progress.'
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD, defaults to today
      tags:
      - daily
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brief'
          description: ''
  /api/v1/deep-work/sessions:
    post:
      operationId: deep_work_sessions_create
      tags:
      - deep-work
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeepWorkStartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeepWorkStartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeepWorkStartRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepWorkSession'
          description: ''
  /api/v1/deep-work/sessions/{id}:
    patch:
      operationId: deep_work_sessions_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - deep-work
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDeepWorkUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDeepWorkUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDeepWorkUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepWorkSession'
          description: ''
  /api/v1/deep-work/sessions/active:
    get:
      operationId: deep_work_sessions_active_retrieve
      tags:
      - deep-work
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepWorkSession'
          description: ''
  /api/v1/interviews:
    post:
      operationId: interviews_create
      description: Begin the interview, or resume the one in progress.
      tags:
      - interviews
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewStep'
          description: ''
  /api/v1/interviews/{id}/complete:
    post:
      operationId: interviews_complete_create
      description: Finish the interview and start protocol generation (async when
        a broker is set).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - interviews
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteResponse'
          description: ''
  /api/v1/interviews/{id}/turns:
    post:
      operationId: interviews_turns_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - interviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnswerRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnswerRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewStep'
          description: ''
  /api/v1/interviews/current:
    get:
      operationId: interviews_current_retrieve
      tags:
      - interviews
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewStep'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    delete:
      operationId: me_destroy
      description: Hard delete the account and everything linked to it.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/consents:
    get:
      operationId: me_consents_list
      description: Read the ledger or append a new decision. Rows are never edited.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consent'
          description: ''
    post:
      operationId: me_consents_create
      description: Read the ledger or append a new decision. Rows are never edited.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsentInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsentInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
          description: ''
  /api/v1/practices/{id}/logs:
    post:
      operationId: practices_logs_create
      description: Mark a practice done (or undo it) for today or yesterday.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - practices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeLogRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PracticeLogRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PracticeLogRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeLog'
          description: ''
  /api/v1/protocols/{id}:
    get:
      operationId: protocols_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - protocols
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protocol'
          description: ''
  /api/v1/protocols/{id}/events:
    get:
      operationId: protocols_events_retrieve
      description: 'Progress stream: `section.ready`, `progress`, `done`, `error`.
        Resume with Last-Event-ID.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - protocols
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: ''
  /api/v1/protocols/{id}/pdf:
    get:
      operationId: protocols_pdf_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - protocols
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/protocols/{id}/rating:
    post:
      operationId: protocols_rating_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - protocols
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RatingRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RatingRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResult'
          description: ''
  /api/v1/protocols/{id}/sections/{key}/revise:
    post:
      operationId: protocols_sections_revise_create
      description: Revise one section through conversation. Other sections are not
        regenerated.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - protocols
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviseRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviseRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviseResult'
          description: ''
  /api/v1/protocols/latest:
    get:
      operationId: protocols_latest_retrieve
      tags:
      - protocols
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protocol'
          description: ''
  /api/v1/reflections:
    get:
      operationId: reflections_retrieve
      parameters:
      - in: query
        name: date
        schema:
          type: string
      tags:
      - reflections
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReflectionResult'
          description: ''
    post:
      operationId: reflections_create
      description: Save the evening reflection. Crisis or distress language pauses
        coaching instead.
      tags:
      - reflections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReflectionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReflectionRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReflectionResult'
          description: ''
  /api/v1/sprints/current:
    get:
      operationId: sprints_current_retrieve
      tags:
      - sprints
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sprint'
          description: ''
  /api/v1/tasks:
    get:
      operationId: tasks_list
      parameters:
      - in: query
        name: done
        schema:
          type: boolean
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: layer
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
      tags:
      - tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{id}:
    patch:
      operationId: tasks_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/traits:
    get:
      operationId: traits_list
      tags:
      - traits
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trait'
          description: ''
  /api/v1/traits/{id}/ratings:
    post:
      operationId: traits_ratings_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - traits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraitRatingRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TraitRatingRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TraitRatingRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraitRatingResult'
          description: ''
  /api/v1/traits/{id}/reflections:
    post:
      operationId: traits_reflections_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - traits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraitReflectionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TraitReflectionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TraitReflectionRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraitReflectionResult'
          description: ''
  /api/v1/weekly-ritual:
    get:
      operationId: weekly_ritual_retrieve
      tags:
      - weekly-ritual
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ritual'
          description: ''
    post:
      operationId: weekly_ritual_create
      tags:
      - weekly-ritual
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RitualAnswersRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RitualAnswersRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RitualAnswersRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ritual'
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - end
      - abandon
      type: string
      description: |-
        * `end` - end
        * `abandon` - abandon
    AnswerRequestRequest:
      type: object
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - answer
    Brief:
      type: object
      properties:
        date:
          type: string
          format: date
        day_number:
          type: integer
        total_days:
          type: integer
        sprint_over:
          type: boolean
        sprint_goal:
          type: string
        tone:
          $ref: '#/components/schemas/ToneEnum'
        headline:
          type: string
        body:
          type: string
        insight:
          type: string
          nullable: true
        week:
          $ref: '#/components/schemas/WeekProgress'
        focus:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        due_tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        completed_today:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        checklist:
          $ref: '#/components/schemas/ChecklistProgress'
        practices:
          type: array
          items:
            $ref: '#/components/schemas/PracticeState'
        practice_streak:
          type: integer
        best_practice_streak:
          type: integer
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleBlock'
        deep_work_target_minutes:
          type: integer
        deep_work_minutes_today:
          type: integer
        reflection_done:
          type: boolean
        ritual:
          $ref: '#/components/schemas/RitualState'
        alter_ego_name:
          type: string
        identity_statement:
          type: string
      required:
      - alter_ego_name
      - best_practice_streak
      - body
      - checklist
      - completed_today
      - date
      - day_number
      - deep_work_minutes_today
      - deep_work_target_minutes
      - due_tasks
      - focus
      - headline
      - identity_statement
      - insight
      - practice_streak
      - practices
      - reflection_done
      - ritual
      - schedule
      - sprint_goal
      - sprint_over
      - tone
      - total_days
      - week
    CadenceEnum:
      enum:
      - daily
      - weekly
      type: string
      description: |-
        * `daily` - daily
        * `weekly` - weekly
    CategoryEnum:
      enum:
      - crisis
      - distress
      type: string
      description: |-
        * `crisis` - crisis
        * `distress` - distress
    ChecklistProgress:
      type: object
      properties:
        total:
          type: integer
        done:
          type: integer
        overdue:
          type: integer
      required:
      - done
      - overdue
      - total
    CompleteResponse:
      type: object
      properties:
        protocol_id:
          type: string
          format: uuid
      required:
      - protocol_id
    Consent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        purpose:
          allOf:
          - $ref: '#/components/schemas/PurposeEnum'
          readOnly: true
        version:
          type: string
          readOnly: true
        granted:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - granted
      - id
      - purpose
      - version
    ConsentInputRequest:
      type: object
      properties:
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        version:
          type: string
          minLength: 1
          maxLength: 32
        granted:
          type: boolean
      required:
      - granted
      - purpose
      - version
    DayOffsetEnum:
      enum:
      - 0
      - 14
      - 30
      type: integer
      description: |-
        * `0` - 0
        * `14` - 14
        * `30` - 30
    DeepWorkSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        task_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        planned_minutes:
          type: integer
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        abandoned:
          type: boolean
          readOnly: true
        actual_minutes:
          type: integer
          readOnly: true
      required:
      - abandoned
      - actual_minutes
      - ended_at
      - id
      - planned_minutes
      - started_at
      - task_id
    DeepWorkStartRequest:
      type: object
      properties:
        planned_minutes:
          type: integer
          maximum: 240
          minimum: 5
          default: 90
        task_id:
          type: string
          format: uuid
          nullable: true
    EntitlementsEnum:
      enum:
      - protocol
      - daily_os
      - character
      - knowledge
      - mentor
      - presence
      - legacy
      - calendar
      type: string
      description: |-
        * `protocol` - protocol
        * `daily_os` - daily_os
        * `character` - character
