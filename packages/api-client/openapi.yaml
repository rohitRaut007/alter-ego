          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeepWorkStartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeepWorkStartRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepWorkSession'
          description: ''
  /api/v1/deep-work/sessions/{id}:
    patch:
      operationId: deep_work_sessions_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - deep-work
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDeepWorkUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDeepWorkUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDeepWorkUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepWorkSession'
          description: ''
  /api/v1/deep-work/sessions/active:
