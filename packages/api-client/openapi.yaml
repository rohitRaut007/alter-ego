              $ref: '#/components/schemas/AnswerRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnswerRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnswerRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
