name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: One lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject foreign lockfiles
        run: |
          bad=$(git ls-files | grep -E '(^|/)(package-lock\.json|yarn\.lock|bun\.lockb?)$' || true)
          if [ -n "$bad" ]; then echo "Only pnpm-lock.yaml is allowed. Found:"; echo "$bad"; exit 1; fi

  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alterego
          POSTGRES_PASSWORD: alterego
          POSTGRES_DB: alterego
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alterego" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret-0123456789abcdef
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://alterego:alterego@localhost:5432/alterego
      AUTH_THROTTLE_RATE: 1000/min
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (Postgres)
        run: python -m pytest -q

  web:
    name: Web, packages, generated client
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Generated client is current
        env:
          PYTHON: python
        run: |
          pnpm gen:api
          git diff --exit-code -- packages/api-client || {
            echo "OpenAPI schema or generated client is stale. Run: pnpm gen:api"; exit 1; }
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
